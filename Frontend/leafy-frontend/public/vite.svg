<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true">
	<title>Plant in pot favicon</title>
	<defs>
		<linearGradient id="leafA" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0%" stop-color="#9ef07a" />
			<stop offset="100%" stop-color="#2fb04b" />
		</linearGradient>
		<linearGradient id="leafB" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0%" stop-color="#6fe48b" />
			<stop offset="100%" stop-color="#1f8b3a" />
		</linearGradient>
	</defs>

	<!-- background circle for clarity on different backgrounds -->
	<rect width="64" height="64" rx="10" fill="#ffffff" />

	<!-- pot -->
	<g transform="translate(0,6)">
		<path d="M12 40c0 5 3 8 8 8h24c5 0 8-3 8-8v-2H12v2z" fill="#b55a2e" />
		<path d="M10 36h44v4c0 6-4 10-10 10H20c-6 0-10-4-10-10v-4z" fill="#8f4724" opacity="0.95" />
		<rect x="14" y="28" width="36" height="8" rx="2" fill="#d78649" />
	</g>

	<!-- soil -->
	<ellipse cx="32" cy="30" rx="14" ry="4" fill="#4b2f1f" />

	<!-- stem and leaves (cartoon style) -->
	<path d="M32 28 C31 22, 36 20, 36 16 C36 12, 32 10, 30 12 C28 14, 26 16, 28 18 C30 20, 34 22, 32 28 Z" fill="url(#leafA)" stroke="#1f6b2a" stroke-width="0.8" stroke-linejoin="round" />

	<path d="M34 30 C40 26, 44 22, 42 18 C40 14, 36 14, 34 16 C32 18, 34 22, 34 30 Z" fill="url(#leafB)" stroke="#1f6b2a" stroke-width="0.7" stroke-linejoin="round" />

	<path d="M30 30 C24 26, 20 22, 22 18 C24 14, 28 14, 30 16 C32 18, 30 22, 30 30 Z" fill="url(#leafB)" stroke="#1f6b2a" stroke-width="0.7" stroke-linejoin="round" />

	<!-- small highlights -->
	<ellipse cx="38" cy="15" rx="3" ry="1.5" fill="#c8ffd3" opacity="0.6" />
	<ellipse cx="26" cy="15" rx="3" ry="1.5" fill="#c8ffd3" opacity="0.5" />

</svg>